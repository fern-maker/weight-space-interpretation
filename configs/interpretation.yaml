interpretation:
  provider: anthropic
  model: claude-opus-5-5
  effort: high                # low | medium | high | xhigh | max
  thinking_display: summarized
  max_tokens: 32000
  max_turns: 16
  max_cost_usd: 80.0          # per stage; pass aborts (resumable) when exceeded
  price_input_per_mtok: 4.0
  price_output_per_mtok: 20.0
  price_cache_read_per_mtok: 0.20
  price_cache_write_per_mtok: 5.0
  request_timeout_s: 900
  outer_retries: 4
  refusal_fallback: false     # a fallback would silently change the model under test
  os_sandbox: true            # wrap tool server in macOS sandbox-exec when available
  export_sig_digits: 6
